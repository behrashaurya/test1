<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Welcome back</h1>
      <p class="muted">Sign in to continue to your dashboard.</p>
      <p class="error">{{error}}</p>
      <form method="post" action="/login">
        <label>
          Email
          <input type="email" name="email" value="{{email}}" autocomplete="email" required />
        </label>
        <label>
          Password
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="submit">Sign in</button>
      </form>
      <p class="muted">No account yet? <a href="/register">Create one</a></p>
    </main>
  </body>
</html>
